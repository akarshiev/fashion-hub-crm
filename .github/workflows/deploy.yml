name: Deploy Fashion Hub CRM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            PROJECT_DIR="${{ secrets.EC2_PROJECT_DIR }}"
            cd "$PROJECT_DIR"

            echo "[CI/CD] Kodni oxirgi versiyaga yangilash..."
            git pull origin main

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "[CI/CD] Backend paketlarini yangilash..."
            cd backend
            npm install --production
            cd ..

            echo "[CI/CD] Frontend paketlarini yangilash va Build qilish..."
            cd frontend
            npm install
            
            # 2-Yechim: Node.js-ga xotirani boshqarish va CPU resursini tejash uchun buyruq beramiz
            # NEXT_DISABLE_SOURCEMAPS resursni sezilarli darajada tejaydi
            export NODE_OPTIONS="--max-old-space-size=1024"
            export NEXT_DISABLE_SOURCEMAPS=1
            
            npm run build
            cd ..

            echo "[CI/CD] Log papkasini yaratish va ruxsat berish..."
            sudo mkdir -p /var/log/crm
            sudo chown -R ec2-user:ec2-user /var/log/crm

            echo "[CI/CD] PM2 orqali xizmatlarni yangilash..."
            if pm2 describe crm-backend > /dev/null 2>&1; then
              echo "Restarting existing processes..."
              pm2 restart crm-backend crm-frontend --update-env
            else
              echo "Starting processes for the first time..."
              pm2 start ecosystem.config.js
            fi

            echo "[CI/CD] Deploy muvaffaqiyatli yakunlandi!"
