name: Deploy Fashion Hub CRM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
          
      - name: Install & Build Frontend
        run: |
          cd frontend
          npm install
          NEXT_DISABLE_SOURCEMAPS=1 npm run build
          cd ..

      - name: Archive build artifacts
        run: tar -czf deploy.tar.gz backend frontend package.json ecosystem.config.js 2>/dev/null || tar -czf deploy.tar.gz backend frontend package.json

      - name: Copy artifacts to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "${{ secrets.EC2_PROJECT_DIR }}"
          
      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            PROJECT_DIR="${{ secrets.EC2_PROJECT_DIR }}"
            cd "$PROJECT_DIR"

            echo "[Deploy] Arxivni ochish..."
            tar -xzf deploy.tar.gz -C .
            rm deploy.tar.gz

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "[Deploy] Backend paketlarini yangilash..."
            cd backend
            npm install --production
            cd ..

            echo "[Deploy] Log ruxsatnomalarini sozlash..."
            sudo mkdir -p /var/log/crm
            sudo chown -R ec2-user:ec2-user /var/log/crm

            echo "[Deploy] PM2 xizmatlarini yangilash..."
            if pm2 describe crm-backend > /dev/null 2>&1; then
              pm2 restart crm-backend crm-frontend --update-env
            else
              pm2 start ecosystem.config.js
            fi

            echo "Deploy muvaffaqiyatli yakunlandi"
