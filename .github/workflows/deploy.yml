name: Deploy Fashion Hub CRM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci


  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Muandislik qoidasi: Biror buyruq xato bersa, skriptni shu joyda to'xtatish
            set -e

            # Loyiha papkasiga o'tish
            PROJECT_DIR="${{ secrets.EC2_PROJECT_DIR }}"
            cd "$PROJECT_DIR"

            echo "[CI/CD] Kodni oxirgi versiyaga yangilash..."
            git pull origin main

            # NVM (Node Version Manager) ni yuklash (Node v20 muhitini faollashtirish)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "[CI/CD] Backend paketlarini yangilash..."
            cd backend
            npm install --production
            cd ..

            echo "[CI/CD] Frontend paketlarini yangilash va Build qilish..."
            cd frontend
            npm install
            npm run build
            cd ..

            echo "[CI/CD] PM2 orqali xizmatlarni Zero-Downtime restart qilish..."
            # --update-env yangi .env o'zgaruvchilari bo'lsa ularni ham kuchga kiritadi
            pm2 restart crm-backend crm-frontend --update-env || pm2 start ecosystem.config.js

            echo "[CI/CD] Deploy muvaffaqiyatli yakunlandi!"
